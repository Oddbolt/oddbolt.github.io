sitemap: false
---
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://oddbolt.github.io https://assets.nintendo.com https://raw.githubusercontent.com https://avatars.githubusercontent.com; connect-src https://api.github.com https://raw.githubusercontent.com https://oddbolt.github.io; base-uri 'none'; form-action 'none'">
<title>Data Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top">
  <h1>Data Admin</h1>
  <nav id="tabs" class="tabs" hidden>
    <button type="button" data-tab="overview" class="active">Overview</button>
    <button type="button" data-tab="review">Review</button>
    <button type="button" data-tab="runs">Runs</button>
    <button type="button" data-tab="catalogue">Catalogue</button>
    <button type="button" data-tab="history">History</button>
  </nav>
  <button type="button" id="signout" class="ghost" hidden>Sign out</button>
</header>

<main id="app">
  <section id="signin" class="card narrow">
    <h2>Sign in</h2>
    <p class="muted">Use a GitHub fine-grained personal access token limited to the data repository. Nothing is sent anywhere except GitHub.</p>
    <label>Repository <input id="repo" autocomplete="off" spellcheck="false" placeholder="owner/name"></label>
    <label>Token <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
    <label class="check"><input id="remember" type="checkbox"> Remember on this device</label>
    <button type="button" id="signin-button">Sign in</button>
    <p id="signin-error" class="error" role="alert"></p>
  </section>
  <div id="view"></div>
</main>

<div id="toast" class="toast" role="status" hidden></div>
<script src="admin.js"></script>
</body>
</html>
