<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" media="screen" type="text/css">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print" type="text/css">

{% seo %}

    {% include head-custom.html %}
  </head>

  <body>
    <!-- Architect theme layout, with the GitHub buttons replaced by app links and contact. -->
    <header>
      <div class="inner">
        <a href="{{ '/' | absolute_url }}">
          <h1>{{ site.title }}</h1>
        </a>
        <h2>{{ site.description }}</h2>
        <a href="mailto:{{ site.contact_email }}" class="button"><small>Contact</small> {{ site.contact_email }}</a>
      </div>
    </header>

    <div id="content-wrapper">
      <div class="inner clearfix">
        <section id="main-content">
          {{ content }}
        </section>

        <aside id="sidebar">
          <h3>Apps</h3>
          <p>
            <a href="{{ '/amiibo-companion/' | relative_url }}">Amiibo Companion</a><br>
            <a href="{{ '/amiibo-companion/privacy.html' | relative_url }}">Privacy policy</a>
          </p>
          <p class="repo-owner">© {{ 'now' | date: "%Y" }} Oddbolt</p>
        </aside>
      </div>
    </div>
  </body>
</html>
