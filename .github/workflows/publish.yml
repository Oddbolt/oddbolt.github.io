name: Publish

# Checks the data and publishes the site to the `published` branch, which GitHub Pages
# and the jsDelivr backup serve. Runs on every push to main and after the weekly update.
# If the check fails, nothing is published: the app keeps getting the last good data,
# and an issue is opened describing the problem.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Allow catalogue to shrink (intentional removals)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check data
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
        run: node scripts/validate-data.mts

      - name: Stamp data
        run: node scripts/publish-data.mts

      - name: Push to published branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -c publish-build
          git add data
          git commit --quiet --allow-empty -m "Publish $(git rev-parse --short main)"
          git push --force origin HEAD:published

      - name: Open an issue if publishing failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Publish failed: data not updated" \
            --body "The site and app data were not updated. The last good version is still live. Details: $RUN_URL"
