name: Update data

# Weekly: refresh the amiibo catalogue from AmiiboAPI and re-check every store link.
# Run it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh catalogue
        run: node scripts/snapshot-catalogue.mts

      - name: Check store links
        run: node scripts/check-links.mts

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Weekly data update"
            git push
          fi
