name: Update data

# Weekly (and on demand from the Actions tab with "Run workflow"):
#   1. Compare the catalogue with AmiiboAPI. New amiibo arrive as a pull request for you
#      to merge; differences in existing amiibo arrive as an issue to review.
#   2. Re-check every store link and save the results.
#   3. Publish.
on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  amiiboapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Compare with AmiiboAPI
        id: sync
        run: node scripts/sync-amiiboapi.mts

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard images)" ]; then
            echo "No new amiibo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -c amiiboapi-sync
          git add data images
          git commit --quiet -m "Add new amiibo from AmiiboAPI"
          git push --force origin amiiboapi-sync
          if [ -n "$(gh pr list --head amiiboapi-sync --state open --json number --jq '.[].number')" ]; then
            gh pr edit amiiboapi-sync --body-file sync-report.md
          else
            gh pr create --base main --head amiiboapi-sync \
              --title "New amiibo from AmiiboAPI" --body-file sync-report.md
          fi

      - name: Open or update the review issue
        if: steps.sync.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="AmiiboAPI differs from our catalogue"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file sync-report.md
          else
            gh issue create --title "$title" --body-file sync-report.md
          fi

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check store links
        run: node scripts/check-links.mts

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/links.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Weekly link check"
            git pull --rebase --quiet
            git push
          fi

  publish:
    needs: links
    uses: ./.github/workflows/publish.yml

  report-failure:
    needs: [amiiboapi, links]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Weekly data update failed" --body "Details: $RUN_URL"
